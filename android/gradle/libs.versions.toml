# 버전은 AGENTS.md 2장 버전 표를 따른다. 표에 없는 항목은 plan.md 1.8의 테스트 전용(junit·json)이다.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ktor = "3.6.0"
# Ktor 3.6.0이 끌어오는 코루틴 버전과 같게 둔다(plan.md 1.8 "Android 런타임 의존성", M0 리뷰).
coroutines = "1.11.0"
zxing = "3.5.4"
webkit = "1.17.1"
activity = "1.13.0"
junit = "4.13.2"
json = "20260719"

[libraries]
# AGP 9 내장 Kotlin의 기본 KGP(2.2.x)를 2.4.20으로 올리기 위한 buildscript classpath 전용 항목.
# org.jetbrains.kotlin.android 플러그인은 적용하지 않는다(AGENTS.md 3장).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
