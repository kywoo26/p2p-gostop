# 태그(v*) 푸시 → 서명된 릴리스 APK를 GitHub Releases에 올린다 (intent/plan.md 5장, M0).
# 저장소 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
# 저장소 Variables: ANDROID_KEY_ALIAS — alias는 비밀이 아니다. secret으로 두면 로그의 모든 "app"이 ***로 가려진다(M0 리뷰 R-5).
#
# 공급망 방어(M0 리뷰 R-1, intent/plan.md 5장 "읽기 전용 웹 빌드와 서명 분리"):
# - 웹 빌드(npm ci + vite)는 서명 비밀이 전혀 없고 토큰 권한이 읽기뿐인 별도 잡(web)의 새 VM에서 돈다. 악성 패키지가
#   gradlew·build.gradle.kts·러너의 액션 코드를 바꿔도 서명 잡(apk)의 작업 트리에는 닿지 않는다. `--ignore-scripts`로
#   설치 스크립트도 막고, 웹 잡은 npm 캐시를 쓰지 않는다. 산출물은 아티팩트(release-web-dist)로만 넘긴다.
#   (이전에는 같은 잡 안의 읽기 전용 Docker 컨테이너였다. 개발 이미지 삭제로 잡 분리로 바꿨다. 아티팩트 할당량이 차면
#   업로드가 실패해 릴리스가 멈추므로, 할당량을 정리한 뒤 workflow_dispatch로 다시 실행한다.)
# - checkout은 `persist-credentials: false`(토큰을 .git/config에 남기지 않음).
# - 서명자 인증서 SHA-256을 고정해 다른 키(디버그 키 포함)로 서명된 APK는 올리지 않는다(M0 리뷰 R-4).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "해당 커밋의 ci 워크플로 성공 확인을 건너뛴다(비상용, 근거를 릴리스 노트에 남길 것)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # 이 커밋의 ci 워크플로 결론·웹 번들 아티팩트 조회
    steps:
      - uses: actions/checkout@v7
        with:
          # versionName(git describe --tags)과 versionCode(커밋 수)를 위해 전체 이력과 태그가 필요하다.
          fetch-depth: 0
          persist-credentials: false

      - name: 태그가 main 이력 위에 있는지 확인
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 ${GITHUB_REF_NAME}(${GITHUB_SHA})가 origin/main 이력에 없습니다. main에 병합한 커밋에만 태그를 붙입니다."
            exit 1
          fi

      # 릴리스 게이트(이슈 #22, A-18): CI 실패·취소 커밋에서 출시되던 문제를 막는다.
      # workflow_dispatch에서 force=true로만 우회 가능(태그 push에는 이 입력이 없어 항상 검사한다).
      - name: 이 커밋의 CI 성공 확인
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | sort_by(.run_started_at) | last | .conclusion // "none"')
          echo "커밋 ${GITHUB_SHA}의 최신 ci 워크플로 결론: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::이 커밋의 ci 워크플로가 success로 끝나지 않았습니다(결론: ${conclusion}). CI가 통과한 커밋에만 태그를 붙이세요. 불가피하면 workflow_dispatch를 이 태그로 수동 실행하며 force=true를 켜고, 그 사실을 릴리스 노트에 남기세요."
            exit 1
          fi

      - name: 동일 SHA의 main CI 웹 번들 복원
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore-web-dist.sh
      # ---- 캐시가 없으면 이 잡에서 빌드 (비밀 없음, 읽기 권한, 설치 스크립트 없음) ----
      - uses: actions/setup-node@v7
        if: steps.web.outputs.reused != 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: 웹 빌드
        if: steps.web.outputs.reused != 'true'
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w packages/web
          cp -R packages/web/dist/. "$RUNNER_TEMP/web-dist/"
      - name: 산출물 확인
        run: test -f "$RUNNER_TEMP/web-dist/index.html" || { echo "::error::웹 빌드 산출물(index.html)이 없습니다."; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: release-web-dist
          path: ${{ runner.temp }}/web-dist
          retention-days: 1

  apk:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Releases 업로드(마지막 단계)에만 필요
    env:
      APK_NAME: p2p-gostop-${{ github.ref_name }}.apk
      # 릴리스 키 인증서 지문(공개 정보, APK에서 누구나 읽을 수 있다). 키를 바꾸면 이 값도 바꾼다.
      EXPECTED_CERT_SHA256: c83292d046a6419f76666f102cbc573dab822a78897b4c2d37a66d96fdef5944
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: ${{ runner.temp }}/web-dist
      - name: 웹 산출물을 assets/web으로 복사
        run: |
          out="$RUNNER_TEMP/web-dist"
          test -f "$out/index.html"
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R "$out/." android/app/src/main/assets/web/
          echo "assets/web 복사 완료: $(find android/app/src/main/assets/web -type f | wc -l)개 파일"
      - name: 작업 트리가 커밋과 같은지 확인
        run: |
          # assets/web은 .gitignore 대상이라 여기 나오지 않는다. 그 밖의 변경·새 파일이 있으면 멈춘다.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::빌드 중 추적 파일이 바뀌었거나 새 파일이 생겼습니다."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true # 태그에서 main 공유 캐시를 갱신하지 않는다.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # ---- Android ----
      - name: 서명 키스토어 복원
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret이 없습니다. 디버그 키로 서명된 APK는 배포하지 않습니다."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::저장소 Variables에 ANDROID_KEY_ALIAS가 없습니다 (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 단위 테스트 + assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 러너 내장 SDK($ANDROID_HOME)의 platforms;android-36·build-tools;36.0.0을 쓴다.
        run: android/gradlew -p android testDebugUnitTest assembleRelease --max-workers=2

      - name: 서명자 인증서 확인, 이름 변경, 체크섬
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee signer.txt
          # 출력 형식: "V2 Signer: certificate SHA-256 digest: <hex>" (구버전은 "Signer #1 certificate SHA-256 digest: <hex>")
          digests=$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' signer.txt | awk '{print $NF}' | sort -u)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" != 1 ]; then
            echo "::error::서명자 인증서가 정확히 하나가 아닙니다: $(tr '\n' ' ' <<<"$digests")"
            exit 1
          fi
          if [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::서명자 인증서 지문이 다릅니다. 기대 $EXPECTED_CERT_SHA256, 실제 $digests (디버그 키나 다른 키로 서명됨)"
            exit 1
          fi
          echo "서명자 인증서 지문 일치: $digests"
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && cat "$APK_NAME.sha256")
          echo "APK 크기: $(stat -c %s "dist/$APK_NAME") bytes"

      - name: 업로드할 완성 APK를 원 웹 artifact와 전수 대조
        run: |
          android/gradlew -p android verifyPackagedWebAssets --max-workers=2 \
            "-PwebAssetsExpectedDir=$RUNNER_TEMP/web-dist" \
            "-PwebAssetsApk=$GITHUB_WORKSPACE/dist/$APK_NAME"

      - name: 키스토어 삭제
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          # 마지막 Gradle gate 뒤에도 서명 비밀을 담을 수 있는 구성 캐시를 정리한다.
          rm -rf android/.gradle/configuration-cache

      - name: GitHub Release 업로드
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          body: |
            ## 설치
            1. 이 페이지를 폰 브라우저(GitHub 로그인)로 열고 아래 **Assets**에서 `${{ env.APK_NAME }}`을 받습니다.
            2. 설치 중 "출처를 알 수 없는 앱" 허용을 묻으면 이 브라우저에 한해 허용합니다.
            3. 같은 서명 키로 만든 APK라 이전 버전 위에 덮어쓰기 설치됩니다.

            ## 실기기 테스트 절차
            - 통합 실기기 테스트: [docs/device-test/procedure.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/device-test/procedure.md)

            빌드 커밋: `${{ github.sha }}` · 서명 인증서 SHA-256: `${{ env.EXPECTED_CERT_SHA256 }}` · 체크섬: `${{ env.APK_NAME }}.sha256`
