# plan.md §2·§5. 러너에서 네이티브로 두 잡을 병렬 실행한다. 로컬과는 같은 버전 핀(.nvmrc·package-lock·Gradle 설정)으로 맞춘다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # #38 이전 main의 Android 잡 ID를 유지해 기존 setup-gradle 캐시를 복원한다.
  android:
    name: lint · check · test · build · android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # FR-31: APK versionCode·versionName에 전체 이력 사용
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lint (oxlint + oxfmt / ESLint + Prettier)
        run: npm run lint
      - name: check (tsc 7 / svelte-check + tsc 6 / knip)
        run: npm run check
      - name: test (단위·속성·계약)
        run: npm test
      - name: build + 번들 예산·외부 URL 검사
        run: npm run build -w packages/web
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        # 구성 캐시(android/.gradle/configuration-cache)는 암호화 키가 있을 때만 저장·복원된다.
        # PR 런에서 복원한 일부 엔트리가 EACCES(scandir)로 잡을 중단시켜(2026-09-30 #162 3회)
        # 키를 main 푸시에만 주어 PR은 구성 캐시 없이 Gradle 홈 캐시만 읽는다.
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ github.ref == 'refs/heads/main' && secrets.GRADLE_ENCRYPTION_KEY || '' }}
      - name: android (assembleDebug · test · lint)
        # 러너 내장 SDK($ANDROID_HOME)에 platforms;android-36·build-tools;36.0.0이 있다(runner-images Ubuntu 24.04).
        # copyWebDist는 위에서 검증한 웹 번들을 APK에 넣는다.
        run: |
          test -f packages/web/dist/index.html
          android/gradlew -p android assembleDebug testDebugUnitTest lint --max-workers=2
      - uses: actions/upload-artifact@v7
        # main의 동일 SHA 릴리스에서 재사용. 용량 부족 시 릴리스의 격리 빌드 잡으로 fallback.
        continue-on-error: true
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        continue-on-error: true
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  e2e:
    name: browser · e2e (${{ matrix.project }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright 버전 (lockfile)
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # P2P E2E는 프로젝트가 chromium이어도 게스트 WebKit을 직접 실행한다.
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.playwright-version.outputs.version }}-both
      - name: Playwright 브라우저·시스템 라이브러리 (캐시 미스)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright 시스템 라이브러리 (캐시 히트)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: 컴포넌트 테스트 (Vitest 브라우저 모드)
        run: npm run test:browser -w packages/web -- --project=${{ matrix.project }}
      - name: E2E (Playwright, ${{ matrix.project }})
        # --no-deps로 다른 엔진 프로젝트의 교차 의존성을 건너뛰며, timing은 다음 단계에서 직렬 실행한다.
        run: npm run e2e -w packages/web -- --project=${{ matrix.project }} --no-deps --workers=2
      - name: E2E timing (${{ matrix.project }})
        # 일반 테스트가 성공한 뒤 같은 러너에서 workers=1로 계측한다(AC-06).
        run: npm run e2e -w packages/web -- --project=timing-${{ matrix.project }} --no-deps --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
