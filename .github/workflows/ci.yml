# plan.md §2·§3-3 B1·§5. 같은 개발 이미지에서 검증을 두 잡으로 병렬 실행한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # 기존 main의 Android 잡 ID를 유지해 setup-gradle 캐시의 연속성을 보존한다.
  android:
    name: lint · check · test · build · android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # FR-31: APK versionCode·versionName에 전체 이력 사용
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: lint (oxlint + oxfmt / ESLint + Prettier)
        run: docker compose run --rm --user root dev npm run lint
      - name: check (tsc 7 / svelte-check + tsc 6 / knip)
        run: docker compose run --rm --user root dev npm run check
      - name: test (단위·속성·계약)
        run: docker compose run --rm --user root dev npm test
      - name: build + 번들 예산·외부 URL 검사
        run: docker compose run --rm --user root -e GITHUB_SHA dev npm run build -w packages/web
      - name: Gradle 캐시 경로 설정
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: android (assembleDebug · test · lint)
        # setup-gradle의 init script·구성 캐시 경로가 호스트/컨테이너에서 같아야 한다.
        # copyWebDist는 위에서 검증한 웹 번들을 APK에 넣는다.
        run: |
          test -f packages/web/dist/index.html
          mkdir -p "$RUNNER_TEMP/dev-home"
          docker compose run --rm --user "$(id -u):$(id -g)" -e HOME="$RUNNER_TEMP/dev-home" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -e GRADLE_USER_HOME -e GRADLE_ENCRYPTION_KEY -e GITHUB_WORKSPACE \
            -e RUNNER_TEMP -e GITHUB_ACTION \
            dev android/gradlew -p android assembleDebug testDebugUnitTest lint --max-workers=2
      - uses: actions/upload-artifact@v7
        # main의 동일 SHA 릴리스에서 재사용. 용량 부족 시 릴리스의 격리 빌드로 fallback.
        continue-on-error: true
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        continue-on-error: true
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  e2e:
    name: browser · e2e (Chromium + WebKit)
    # 기존 실행 범위 유지. AC-06 프로젝트 의존성·직렬 계측도 그대로 둔다.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: 컴포넌트 테스트 (Vitest 브라우저 모드)
        run: docker compose run --rm --user root dev npm run test:browser
      - name: E2E (Playwright, Chromium + WebKit)
        run: docker compose run --rm --user root dev npm run e2e -w packages/web
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
