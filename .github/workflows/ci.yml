# CI (plan.md 5장). 러너는 ubuntu-24.04 고정.
# 로컬과 같은 개발 이미지(docker/Dockerfile, compose.yaml의 dev 서비스)를 러너에서 빌드하고
# 모든 검사를 로컬과 똑같은 `docker compose run --rm dev …` 명령으로 돌린다(드리프트 방지, 별도 미러 스크립트 없음).
#
# 한 잡으로 묶은 이유(비공개 저장소 월 2,000분 예산): 이미지 빌드(베이스 풀 포함)를 한 번만 치르고, 잡마다 반복되던
# 체크아웃·npm ci·이미지 풀을 없앤다. 대신 벽시계 시간은 검사들의 합이 된다. 앞 단계가 실패하면 뒤 단계를 건너뛰어 분을 아낀다.
# E2E·컴포넌트 테스트는 PR·수동 실행에서만 돈다. 아티팩트(web-dist, debug APK)도 계정 저장 할당량을 아끼려고
# PR·수동 실행에서만 올린다(M0 리뷰 4.2). 배포용 APK의 정본은 Releases(release.yml)다.
#
# --user root: 러너 체크아웃은 uid 1001 소유라 compose의 기본 사용자(uid 1000)는 쓸 수 없다. 일회용 러너라 root로 돈다
# (이미지의 git safe.directory 설정 덕에 Gradle의 git describe도 동작한다).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint · check · test · build · e2e · android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FULL: ${{ github.event_name != 'push' }} # PR·수동 실행에서만 E2E와 아티팩트
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 개발 이미지 빌드 (docker/Dockerfile)
        run: docker compose build dev
      - name: npm ci
        run: docker compose run --rm --user root dev npm ci
      - name: lint (oxlint + oxfmt / ESLint + Prettier)
        run: docker compose run --rm --user root dev npm run lint
      - name: check (tsc 7 / svelte-check + tsc 6 / knip)
        run: docker compose run --rm --user root dev npm run check
      - name: test (단위·속성·계약)
        run: docker compose run --rm --user root dev npm test
      - name: build + 번들 예산·외부 URL 검사
        run: docker compose run --rm --user root dev npm run build -w packages/web
      - name: 컴포넌트 테스트 (Vitest 브라우저 모드)
        if: env.FULL == 'true'
        run: docker compose run --rm --user root dev npm run test:browser
      - name: E2E (Playwright, Chromium + WebKit)
        if: env.FULL == 'true'
        run: docker compose run --rm --user root dev npm run e2e -w packages/web
      # 이슈 #33: APK 단위 테스트·Lint를 웹 번들이 들어간 상태(릴리스와 같은 상태)에서 돌린다. 위 build 단계의
      # packages/web/dist를 release.yml과 같은 방식으로 assets/web에 넣는다(Gradle copyWebDist도 같은 내용으로 동기화한다).
      - name: 웹 번들을 APK 자산(assets/web)으로 복사
        run: |
          if [ ! -f packages/web/dist/index.html ]; then
            echo "::error::웹 빌드 산출물(packages/web/dist/index.html)이 없습니다."
            exit 1
          fi
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R packages/web/dist/. android/app/src/main/assets/web/
          echo "assets/web: $(find android/app/src/main/assets/web -type f | wc -l)개 파일"
      # Gradle 의존성·배포판 캐시(약 0.9GB). 일회용 러너라 compose의 명명 볼륨은 매번 비므로, 러너 폴더를 컨테이너의
      # Gradle 홈(/root/.gradle)에 붙이고 actions/cache로 보존한다. 컨테이너가 root로 쓴 0600 파일(build-cache-1 등)을
      # 러너 사용자가 tar로 읽을 수 있도록 빌드 뒤 권한을 연다(아래 단계). 안 열면 캐시 저장이 실패한다.
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/gradle-home/caches
            ${{ runner.temp }}/gradle-home/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: android (assembleDebug · test · lint)
        run: docker compose run --rm --user root -v "$RUNNER_TEMP/gradle-home:/root/.gradle" dev android/gradlew -p android assembleDebug testDebugUnitTest lint
      - name: Gradle 캐시 권한 열기 (actions/cache 저장용)
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/gradle-home"

      - uses: actions/upload-artifact@v7
        if: failure() && env.FULL == 'true'
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: env.FULL == 'true'
        continue-on-error: true # 계정 공용 아티팩트 용량(500MB) 초과 시에도 CI는 통과
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: env.FULL == 'true'
        continue-on-error: true
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
