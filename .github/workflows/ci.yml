# CI (plan.md 5장). 러너는 ubuntu-24.04 고정. 로컬의 ./dev.sh와 같은 명령을 쓴다.
# 비공개 저장소 월 2,000분 예산: Node 검사는 한 잡으로 묶고, E2E는 PR·수동 실행에서만 돈다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: lint · check · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lint (oxlint + oxfmt / ESLint + Prettier)
        run: npm run lint
      - name: check (tsc 7 / svelte-check + tsc 6 / knip)
        run: npm run check
      - name: test (단위·속성·계약)
        run: npm test
      - name: build + 번들 예산·외부 URL 검사
        run: npm run build
      - uses: actions/upload-artifact@v7
        continue-on-error: true # 계정 공용 아티팩트 용량(500MB) 초과 시에도 CI는 통과
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 3

  e2e:
    name: e2e (Chromium + WebKit)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 태그는 @playwright/test 버전과 반드시 일치 (AGENTS.md 2장)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: 컴포넌트 테스트 (Vitest 브라우저 모드)
        run: npm run test:browser -w packages/web
      - name: E2E (Playwright)
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7

  android:
    name: android (assembleDebug · test · lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # android/ 골격이 생기기 전에는 건너뛴다 (hashFiles는 잡 수준 if에서 쓸 수 없어 스텝마다 검사)
      - id: detect
        run: echo "present=${{ hashFiles('android/settings.gradle.kts') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6
      - if: steps.detect.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lint
      - if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true # 배포 APK는 Releases로 나가므로 CI 아티팩트는 보조
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
