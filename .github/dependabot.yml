# 의존성 갱신 (plan.md 1.8, 5장). 쿨다운 3일을 생태계마다 명시해 .npmrc min-release-age=3과 맞춘다
# (기본값에 기대지 않는다, M0 리뷰 4.3).
# Kotlin·AGP·Gradle·Ktor 등 AGENTS.md 2장 버전 표에 있는 항목을 올리는 PR은 표도 함께 고친다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # packages/web은 TypeScript 6 고정 (typescript-eslint <6.1, svelte-check ^5||^6). 7은 별칭 typescript-7로만 쓴다.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # 런타임은 Node 24 LTS
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # Playwright는 Docker 이미지 태그(v1.63.0-noble)와 함께 올린다
      - dependency-name: '@playwright/test'
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: playwright
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      # Ktor 아티팩트 3개와 Ktor가 요구하는 코루틴 버전은 한 PR로 함께 올린다.
      ktor:
        patterns:
          - "io.ktor:*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
