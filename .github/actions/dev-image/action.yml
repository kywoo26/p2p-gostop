name: 개발 이미지 준비
description: PR #38의 Compose 이미지에 BuildKit 레이어 캐시를 적용한다.
inputs:
  install:
    description: 릴리스는 읽기 전용 컨테이너에서 별도로 설치한다.
    default: 'true'
outputs:
  image:
    description: Compose dev 서비스의 이미지 이름 (태그의 단일 근거).
    value: ${{ steps.compose.outputs.image }}
runs:
  using: composite
  steps:
    - name: Compose 이미지 이름
      id: compose
      shell: bash
      run: echo "image=$(docker compose config --images dev)" >> "$GITHUB_OUTPUT"
    # docker driver의 GHA 캐시는 containerd 저장소가 필요하다(Docker 공식 지원 조합).
    # 별도 builder 컨테이너의 tar export → docker load 왕복을 피한다.
    - uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          { "features": { "containerd-snapshotter": true } }
    - uses: docker/setup-buildx-action@v4
      with:
        driver: docker
    - uses: docker/build-push-action@v7
      with:
        context: docker
        load: true
        tags: ${{ steps.compose.outputs.image }}
        cache-from: type=gha,scope=dev-image
        cache-to: type=gha,scope=dev-image,mode=max
      env:
        # 계정 아티팩트 할당량은 테스트 결과용으로 남긴다. 캐시는 Actions cache에 저장된다.
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
    - uses: actions/cache@v6
      if: inputs.install == 'true'
      with:
        path: ${{ runner.temp }}/npm-cache
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    - name: npm ci (다운로드 캐시, lockfile 검증 유지)
      if: inputs.install == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/npm-cache"
        docker compose run --rm --user "$(id -u):$(id -g)" \
          -e npm_config_cache=/npm-cache -v "$RUNNER_TEMP/npm-cache:/npm-cache" dev npm ci
