# p2p-gostop 개발 환경. 모든 빌드·테스트는 컨테이너 안에서 실행한다 (plan.md 2장).
# 사용: ./dev.sh <task>  (직접 호출: docker compose -f docker/compose.yml run --rm <service> <cmd>)
name: p2p-gostop

x-common: &common
  working_dir: /work
  volumes:
    - ..:/work
  environment:
    CI: "${CI:-}"
    TZ: Asia/Seoul

services:
  # 엔진·AI·프로토콜 단위 테스트, 웹 빌드, sim CLI
  node:
    <<: *common
    image: node:24-bookworm-slim
    volumes:
      - ..:/work
      - node_modules:/work/node_modules
    user: "1000:1000"

  # Playwright E2E, Vitest 브라우저 모드 (Chromium + WebKit). 태그는 @playwright/test 버전과 반드시 일치.
  e2e:
    <<: *common
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    volumes:
      - ..:/work
      - node_modules:/work/node_modules
    ipc: host
    user: "1000:1000"
    ports:
      - "5173:5173"   # vite dev (필요 시)
      - "17777:17777" # relay-dev

  # Android APK 빌드·테스트 (JDK 21, platforms 34~37, Node 포함)
  android:
    <<: *common
    image: cimg/android:2026.08.1-node
    volumes:
      - ..:/work
      - gradle-cache:/home/circleci/.gradle
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      TZ: Asia/Seoul

volumes:
  node_modules:
  gradle-cache:
