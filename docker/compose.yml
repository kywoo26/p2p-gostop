# p2p-gostop 개발 환경. 모든 빌드·테스트는 컨테이너 안에서 실행한다 (plan.md 2장).
# 사용: ./dev.sh <task>  (직접 호출: docker compose -f docker/compose.yml run --rm <service> <cmd>)
name: p2p-gostop

x-common: &common
  working_dir: /work
  volumes:
    - ..:/work
  environment:
    CI: '${CI:-}'
    TZ: Asia/Seoul

services:
  # 엔진·AI·프로토콜 단위 테스트, 웹 빌드, sim CLI
  node:
    <<: *common
    image: node:24-bookworm-slim
    volumes:
      - ..:/work
      - node_modules:/work/node_modules
    user: '1000:1000'
    ports: # ./dev.sh dev:web, ./dev.sh relay 에서만 게시(--service-ports)
      - '5173:5173' # vite dev
      - '17777:17777' # relay-dev

  # Playwright E2E, Vitest 브라우저 모드 (Chromium + WebKit). 태그는 @playwright/test 버전과 반드시 일치.
  e2e:
    <<: *common
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    volumes:
      - ..:/work
      - node_modules:/work/node_modules
    ipc: host
    user: '1000:1000'
    ports:
      - '5173:5173' # vite dev (필요 시)
      - '17777:17777' # relay-dev

  # Android APK 빌드·테스트 (JDK 21, platforms 34~37, Node 포함)
  android:
    <<: *common
    image: cimg/android:2026.08.1-node
    user: '1000:1002' # 호스트 uid 1000(바인드 마운트 쓰기) + gid circleci(/home/circleci 750을 지나 android-sdk 접근)
    volumes:
      - ..:/work
      - android-home:/home/ubuntu # uid 1000의 HOME: ~/.gradle, ~/.android/debug.keystore(디버그 서명 고정)
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      TZ: Asia/Seoul
      # 값 없이 선언: 호스트에 설정된 경우에만 전달하고, 없으면 컨테이너에서도 미설정(빈 문자열 아님).
      # 빈 문자열이 넘어가면 Gradle environmentVariable(...).orNull이 ""를 돌려 file("")이 실패한다.
      ANDROID_KEYSTORE_PATH:
      ANDROID_KEYSTORE_PASSWORD:
      ANDROID_KEY_ALIAS:
      ANDROID_KEY_PASSWORD:

volumes:
  node_modules:
  android-home:
