<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>맞고 · 시각 방향 제안</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font), system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      font-synthesis: none;
    }
    button {
      font: inherit;
      cursor: pointer;
      color: inherit;
      border: 0;
    }
    h1,
    h2,
    p {
      margin: 0;
    }
    small {
      font-size: 12px;
    }
    b,
    strong,
    .num {
      font-variant-numeric: tabular-nums;
    }
    body[data-theme="ink"] {
      --bg: oklch(19% 0.018 170);
      --table: oklch(24% 0.025 170);
      --panel: oklch(28% 0.025 170);
      --ink: oklch(95% 0.025 85);
      --muted: oklch(76% 0.025 140);
      --accent: oklch(86% 0.07 85);
      --on: oklch(20% 0.025 160);
      --line: oklch(49% 0.03 160);
      --font: VDPretendard;
      --radius: 12px;
    }
    body[data-theme="club"] {
      --bg: oklch(17% 0.022 280);
      --table: oklch(22% 0.035 280);
      --panel: oklch(27% 0.035 280);
      --ink: oklch(96% 0.018 85);
      --muted: oklch(77% 0.026 280);
      --accent: oklch(82% 0.1 75);
      --on: oklch(19% 0.025 280);
      --line: oklch(49% 0.04 280);
      --font: VDSUIT;
      --radius: 20px;
    }
    body[data-theme="pop"] {
      --bg: oklch(20% 0.045 275);
      --table: oklch(26% 0.055 275);
      --panel: oklch(32% 0.06 275);
      --ink: oklch(97% 0.012 100);
      --muted: oklch(80% 0.03 275);
      --accent: oklch(89% 0.19 120);
      --on: oklch(20% 0.045 275);
      --line: oklch(55% 0.065 275);
      --font: VDWanted;
      --radius: 24px;
    }
    .app {
      height: 100dvh;
      padding: 20px 16px 16px;
      overflow: hidden;
      position: relative;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      gap: 12px;
    }
    .brand {
      font-weight: 750;
      font-size: 18px;
      letter-spacing: -0.5px;
    }
    .brand i {
      font-style: normal;
      color: var(--accent);
      margin-right: 8px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 650;
      color: var(--accent);
    }
    .quiet {
      color: var(--muted);
    }
    .menu {
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot {
      height: 6px;
      width: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .primary,
    .secondary {
      border-radius: var(--radius);
      min-height: 52px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 720;
      background: var(--accent);
      color: var(--on);
    }
    .secondary {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .hero {
      height: 425px;
      position: relative;
      padding-top: 40px;
    }
    .hero h1 {
      font-size: 52px;
      line-height: 1.12;
      letter-spacing: -2.5px;
      font-weight: 720;
      margin-top: 16px;
      position: relative;
      z-index: 2;
    }
    .hero p {
      font-size: 16px;
      color: var(--muted);
      margin-top: 16px;
      position: relative;
      z-index: 2;
    }
    .hero-art {
      position: absolute;
      width: 230px;
      height: 230px;
      right: -24px;
      bottom: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 45%,
        var(--panel),
        transparent 70%
      );
    }
    .hero-art:before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .hero-art img {
      position: absolute;
      width: 80px;
      bottom: 34px;
      left: 42px;
      transform: rotate(-18deg);
      box-shadow: 0 12px 22px #0005;
    }
    .hero-art img:nth-child(2) {
      left: 103px;
      bottom: 28px;
      transform: rotate(14deg);
    }
    .home-actions {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .home-actions button {
      height: 68px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .home-actions button span {
      font-size: 22px;
    }
    .bottom-nav {
      margin-top: 32px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      display: flex;
      justify-content: space-around;
      gap: 8px;
    }
    .bottom-nav button {
      background: none;
      min-height: 48px;
      min-width: 48px;
      color: var(--muted);
      font-size: 14px;
    }
    .build {
      font-size: 11px;
      color: var(--muted);
      margin-top: 12px;
      text-align: center;
    }
    .game {
      display: grid;
      grid-template-rows: 48px 84px 52px minmax(0, 1fr) 118px 56px 214px;
      gap: 6px;
    }
    .scoreboard {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-rows: 1fr 1fr;
    }
    .seat {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
    }
    .seat + .seat {
      border-top: 1px solid color-mix(in oklch, var(--line), transparent 55%);
    }
    .avatar {
      width: 25px;
      height: 25px;
      border: 1px solid var(--line);
      border-radius: 50%;
      text-align: center;
      font-size: 12px;
      line-height: 23px;
    }
    .seat .who {
      width: 53px;
    }
    .seat .points {
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -1px;
      min-width: 49px;
    }
    .points small {
      font-size: 12px;
      margin-left: 2px;
      font-weight: 500;
    }
    .seat .balance {
      margin-left: auto;
      text-align: right;
      font-size: 14px;
    }
    .seat.mine .points {
      color: var(--accent);
    }
    .captured {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-items: center;
    }
    .pile {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .pile img {
      width: 20px;
      height: 33px;
      object-fit: contain;
    }
    .pile b {
      font-size: 14px;
      display: block;
    }
    .pile small {
      font-size: 12px;
      color: var(--muted);
    }
    .floor {
      display: flex;
      align-items: center;
      background: var(--table);
      border-radius: var(--radius);
      position: relative;
      padding: 10px 8px;
      gap: 6px;
    }
    .deck {
      width: 48px;
      flex-shrink: 0;
      text-align: center;
    }
    .deck img {
      width: 34px;
      border: 1px solid var(--ink);
      border-radius: 3px;
    }
    .deck small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
    }
    .floor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      align-content: center;
      gap: 12px 5px;
      width: 100%;
    }
    .floor-card {
      display: grid;
      place-items: center;
      position: relative;
      min-width: 48px;
      height: 74px;
    }
    .floor-card img {
      width: 42px;
      height: 68px;
    }
    .floor-card.match:after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid var(--accent);
      border-radius: 6px;
    }
    .month {
      position: absolute;
      right: 0;
      top: -3px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 0 3px;
      font-size: 12px;
    }
    .prompt {
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      position: relative;
    }
    .prompt .title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 650;
      font-size: 16px;
      margin-bottom: 7px;
    }
    .prompt .pair button {
      min-height: 48px;
      font-size: 14px;
      padding: 8px;
    }
    .prompt .explain {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .prompt.go {
      border-color: var(--accent);
    }
    .prompt.go .title strong {
      font-size: 20px;
      color: var(--accent);
    }
    .hand-wrap {
      border-top: 1px solid var(--line);
      padding-top: 7px;
    }
    .hand-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .hand {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 92px);
      gap: 5px 8px;
    }
    .hand button {
      position: relative;
      padding: 0;
      background: transparent;
      min-height: 92px;
      display: grid;
      place-items: center;
    }
    .hand img {
      height: 91px;
      width: 56px;
      object-fit: contain;
    }
    .hand .month {
      right: 3px;
      top: 0;
    }
    .event {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100%;
      position: relative;
    }
    .event strong {
      font-size: 58px;
      line-height: 1;
      font-weight: 850;
      color: var(--event);
      letter-spacing: -3px;
    }
    .event p {
      font-size: 16px;
      font-weight: 650;
    }
    .event small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }
    .event:before,
    .event:after {
      content: "";
      position: absolute;
      border: 2px solid var(--event);
      height: 12px;
      width: 12px;
      left: 5px;
      top: 4px;
      transform: rotate(20deg);
    }
    .event:after {
      left: auto;
      top: auto;
      right: 4px;
      bottom: 2px;
    }
    .prompt.effect {
      border-color: var(--event);
      --event: oklch(78% 0.13 25);
    }
    .prompt.effect.jjok {
      --event: oklch(81% 0.1 240);
    }
    .result {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .result-heading {
      padding: 22px 0 4px;
    }
    .result-heading h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-top: 10px;
    }
    .result-hero {
      padding: 28px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }
    .result-hero .eyebrow {
      margin-bottom: 8px;
    }
    .payout {
      font-size: 48px;
      font-weight: 750;
      letter-spacing: -2px;
      color: var(--accent);
    }
    .payout small {
      font-size: 18px;
      letter-spacing: 0;
    }
    .result-cards {
      display: flex;
      gap: 8px;
      position: absolute;
      right: 20px;
      top: 18px;
      opacity: 0.16;
      transform: rotate(15deg);
    }
    .result-cards img {
      width: 44px;
    }
    .ledger {
      border-top: 1px solid var(--line);
      margin-top: 8px;
    }
    .ledger div {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid color-mix(in oklch, var(--line), transparent 50%);
      font-size: 16px;
    }
    .ledger .total {
      font-weight: 750;
      color: var(--accent);
    }
    .money {
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .money div {
      display: flex;
      justify-content: space-between;
    }
    .result .pair {
      margin-top: auto;
    }
    .result-foot {
      font-size: 12px;
      text-align: center;
      color: var(--muted);
    }
    [data-theme="club"] .hero {
      text-align: center;
      padding-top: 28px;
      height: 425px;
    }
    [data-theme="club"] .hero h1 {
      font-size: 46px;
      font-weight: 620;
      letter-spacing: -2px;
    }
    [data-theme="club"] .hero-art {
      right: 75px;
      bottom: -2px;
      width: 230px;
      height: 220px;
      border-radius: 110px 110px 26px 26px;
    }
    [data-theme="club"] .hero-art:before {
      border-radius: 100px 100px 16px 16px;
    }
    [data-theme="club"] .scoreboard {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    [data-theme="club"] .floor {
      border: 1px solid var(--line);
      border-radius: 50px 50px 25px 25px;
    }
    [data-theme="club"] .event strong {
      font-weight: 650;
    }
    [data-theme="club"] .event:before,
    [data-theme="club"] .event:after {
      border-radius: 50%;
      width: 18px;
      height: 18px;
    }
    [data-theme="club"] .result-heading {
      text-align: center;
    }
    [data-theme="club"] .result-hero {
      text-align: center;
      border-color: var(--accent);
    }
    [data-theme="pop"] .hero h1 {
      font-size: 59px;
      letter-spacing: -3px;
      font-weight: 850;
    }
    [data-theme="pop"] .hero-art {
      border: 0;
      background: var(--accent);
      width: 180px;
      height: 180px;
      border-radius: 40px;
      right: 6px;
      bottom: 4px;
      transform: rotate(-8deg);
    }
    [data-theme="pop"] .hero-art:before {
      border: 0;
    }
    [data-theme="pop"] .hero-art img {
      width: 68px;
      left: 24px;
      bottom: 28px;
    }
    [data-theme="pop"] .hero-art img:nth-child(2) {
      left: 80px;
      bottom: 22px;
    }
    [data-theme="pop"] .scoreboard {
      border: 0;
      background: var(--panel);
      border-radius: 20px;
    }
    [data-theme="pop"] .avatar {
      border: 0;
      background: var(--accent);
      color: var(--on);
      border-radius: 8px;
    }
    [data-theme="pop"] .prompt {
      border-width: 2px;
    }
    [data-theme="pop"] .event strong {
      transform: rotate(-8deg);
      font-weight: 900;
    }
    [data-theme="pop"] .event:before,
    [data-theme="pop"] .event:after {
      border: 0;
      background: var(--event);
      width: 9px;
      height: 23px;
    }
    [data-theme="pop"] .result-hero {
      background: var(--accent);
      color: var(--on);
      border: 0;
    }
    [data-theme="pop"] .result-hero .payout,
    [data-theme="pop"] .result-hero .eyebrow {
      color: var(--on);
    }
  </style>
  <style>
    .game:has(.prompt.target) {
      grid-template-rows: 48px 84px 52px minmax(0, 1fr) 158px 56px 214px;
    }
    .prompt.target .pair button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 84px;
      padding: 6px 10px;
      text-align: left;
    }
    .prompt.target .pair img {
      width: 44px;
      height: 72px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .prompt.target .pair span {
      display: block;
      font-size: 14px;
    }
    .prompt.target .pair small {
      display: block;
      font-weight: 500;
      font-size: 12px;
      margin-top: 2px;
    }
  </style>
  <body>
    <main id="app"></main>
    <script>
      const query = new URLSearchParams(location.search);
      const theme = ["ink", "club", "pop"].includes(query.get("theme"))
        ? query.get("theme")
        : "ink";
      const scene = query.get("scene") || "home";
      document.body.dataset.theme = theme;
      const card = (id, extra = "") =>
        `<img src="../../../packages/web/public/cards/${id}.svg" alt="${id === "back" ? "카드 뒷면" : `${Math.floor(id / 4) + 1}월 화투`}" ${extra}>`;
      const topBar = (label = "맞고") =>
        `<header class="top"><div class="brand"><i>◈</i>${label}</div><button class="menu" aria-label="메뉴">☰</button></header>`;
      const home = () =>
        `${topBar("홈")}<section class="hero"><h1>맞고</h1><div class="hero-art">${card(0)}${card(28)}</div></section><div class="home-actions"><button class="primary">친구와 대전<span>↗</span></button><button class="secondary">혼자 연습<span>→</span></button></div><nav class="bottom-nav"><button>기록</button><button>설정</button><button>진단</button></nav>`;
      const piles = (mine) =>
        `<div class="captured">${(mine
          ? [
              [8, "광 2/3", "고도리 1/3"],
              [24, "열끗 2/5", ""],
              [33, "띠 3/5", "홍단 2/3"],
              [35, "피 12/10", ""],
            ]
          : [
              [40, "광 1/3", "고도리 0/3"],
              [44, "열끗 1/5", ""],
              [41, "띠 2/5", "홍단 1/3"],
              [43, "피 8/10", ""],
            ]
        )
          .map(
            ([id, label, sub]) =>
              `<div class="pile">${card(id)}<div><b>${label}</b><small>${sub || "획득패"}</small></div></div>`,
          )
          .join("")}</div>`;
      const prompt = () => {
        if (scene === "gostop")
          return `<section class="prompt go" aria-label="고 스톱 선택"><div class="title"><span>고 / 스톱 · 7점</span><strong>700냥</strong></div><div class="pair"><button class="secondary">고 · 계속하기</button><button class="primary">스톱 · 700냥</button></div><p class="explain">지금 스톱 예상액 · 고 후 역전되면 고박 위험</p></section>`;
        if (scene === "ppeok" || scene === "jjok")
          return `<section class="prompt effect ${scene}" aria-label="사건 프레임"><div class="event"><strong>${scene === "ppeok" ? "뻑" : "쪽"}</strong><div><p>${scene === "ppeok" ? "나 · 바닥 3장" : "나 · 획득"}</p><small>${scene === "ppeok" ? "같은 월 3장 묶음" : "획득패로 이동 중"}</small></div></div></section>`;
        return `<section class="prompt target"><div class="title"><span>먹을 패 선택</span><small class="quiet">내 차례</small></div><div class="pair"><button class="secondary" aria-label="4월 초단 먹기">${card(13)}<span>4월 · 초단<small>이 패 먹기</small></span></button><button class="secondary" aria-label="4월 피 먹기">${card(15)}<span>4월 · 피<small>이 패 먹기</small></span></button></div><p class="explain">바닥 후보 2장</p></section>`;
      };
      const game = () =>
        `${topBar('3번째 판 <small class="quiet">· 정통</small>')}<section class="scoreboard"><div class="seat"><span class="avatar">상</span><span class="who">상대 <small>6장</small></span><span class="points">3<small>점</small></span><span>0고 · ×1</span><span class="balance">149,300냥</span></div><div class="seat mine"><span class="avatar">나</span><span class="who">나</span><span class="points">7<small>점</small></span><span>0고 · ×1</span><span class="balance">150,700냥</span></div></section>${piles(false)}<section class="floor" aria-label="바닥"><div class="deck">${card("back")}<small>더미 15</small></div><div class="floor-grid">${[1, 5, 10, 13, 15, 21, 26, 29].map((id, i) => `<div class="floor-card ${scene === "game" && [3, 4].includes(i) ? "match" : ""}">${card(id)}<span class="month">${Math.floor(id / 4) + 1}월</span></div>`).join("")}</div></section>${prompt()}${piles(true)}<section class="hand-wrap"><div class="hand-label"><b>내 손패</b><span>${scene === "game" || scene === "gostop" ? "선택 대기" : "사건 재생 중"}</span></div><div class="hand">${[0, 4, 9, 12, 16, 20, 25, 28, 32, 37].map((id) => `<button aria-label="${Math.floor(id / 4) + 1}월 카드">${card(id)}<span class="month">${Math.floor(id / 4) + 1}월</span></button>`).join("")}</div></section>`;
      const result = () =>
        `${topBar("정산")}<div class="result-heading"><div class="eyebrow">3번째 판 · 스톱</div><h1>승리</h1></div><section class="result-hero"><div class="result-cards">${card(0)}${card(28)}</div><div class="eyebrow">이번 판 획득 금액</div><div class="payout">+700 <small>냥</small></div><p>7점 × 1배 × 점당 100냥</p></section><section><div class="eyebrow">점수와 배수</div><div class="ledger"><div><span>족보 점수</span><b>7점</b></div><div><span>고 가산</span><b>+0점</b></div><div><span>적용 배수</span><b>×1</b></div><div class="total"><span>최종 정산</span><b>700냥</b></div></div></section><section class="money"><div><span class="quiet">내 잔액</span><b>150,000 → 150,700냥</b></div><div><span class="quiet">상대 잔액</span><b>150,000 → 149,300냥</b></div></section><div class="pair"><button class="secondary">세션 종료</button><button class="primary">다음 판 →</button></div><p class="result-foot">3판 완료</p>`;
      const app = document.getElementById("app");
      app.className = `app ${scene === "home" ? "home" : scene === "settlement" ? "result" : "game"}`;
      app.innerHTML =
        scene === "home" ? home() : scene === "settlement" ? result() : game();
    </script>
  </body>
</html>
