<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  E2E 스크린샷의 시스템 글꼴 집합 고정(plan §2 버전 핀). playwright.config.ts가 FONTCONFIG_FILE로 지정한다.
  `npx playwright install-deps`가 설치하는 글꼴 패키지만 허용하고, 호스트·러너에 따로 깔린 글꼴(Noto CJK·DejaVu·Ubuntu 등)과
  사용자 글꼴은 거부한다. 앱 글꼴(Pretendard)은 번들 @font-face라 영향이 없다.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <selectfont>
    <!-- glob은 절대 경로여야 한다(fontconfig 2.15 실측: '*' 단독은 아무것도 거부하지 않는다). -->
    <rejectfont>
      <glob>/usr/share/fonts/*</glob>
      <glob>/usr/local/share/fonts/*</glob>
      <glob>/home/*</glob>
      <glob>/root/*</glob>
    </rejectfont>
    <acceptfont>
      <!-- 디렉터리에도 같은 필터가 적용되므로 허용 글꼴의 상위 디렉터리를 정확한 경로로 허용한다. -->
      <glob>/usr/share/fonts/X11</glob>
      <glob>/usr/share/fonts/X11/Type1</glob>
      <glob>/usr/share/fonts/opentype</glob>
      <glob>/usr/share/fonts/opentype/ipafont-gothic</glob>
      <glob>/usr/share/fonts/opentype/tlwg</glob>
      <glob>/usr/share/fonts/opentype/unifont</glob>
      <glob>/usr/share/fonts/truetype</glob>
      <glob>/usr/share/fonts/truetype/freefont</glob>
      <glob>/usr/share/fonts/truetype/liberation</glob>
      <glob>/usr/share/fonts/truetype/noto</glob>
      <glob>/usr/share/fonts/truetype/wqy</glob>
      <glob>/usr/share/fonts/X11/Type1/c0*bt_.pfb</glob>
      <glob>/usr/share/fonts/opentype/ipafont-gothic/*</glob>
      <glob>/usr/share/fonts/opentype/tlwg/Loma*</glob>
      <glob>/usr/share/fonts/opentype/unifont/*</glob>
      <glob>/usr/share/fonts/truetype/fonts-japanese-gothic.ttf</glob>
      <glob>/usr/share/fonts/truetype/freefont/*</glob>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
      <glob>/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
