<!doctype html>
<html lang="ko">
  <head>
    <script>
      // MVP: 역할 파라미터가 있거나(호스트 WebView) 게스트(iPhone, 127.0.0.1이 아닌 주소)가 접속하면 최소 P2P 페이지로 보낸다.
      (function () {
        var q = location.search;
        var host = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
        if (/[?&]role=(host|guest)/.test(q)) location.replace('/p2p/index.html' + q);
        else if (!host) location.replace('/p2p/index.html?role=guest');
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14171f" />
    <link rel="icon" href="data:," />
    <title>맞고 P2P</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
